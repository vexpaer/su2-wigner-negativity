name: F18 Lean verification
on:
  pull_request:
    paths:
      - 'lean/**'
      - '.github/workflows/lean.yml'
  push:
    branches: [main, 'lean/**']
    paths:
      - 'lean/**'
      - '.github/workflows/lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@498ce7030982ff0e0cecd98a8f5a7c90615b4e41
        with:
          lake-package-directory: lean
          auto-config: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'false'
      - name: Build and audit the pinned F18 project
        run: bash lean/check.sh
